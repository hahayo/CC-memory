# docker-compose.test.yml
# 本機跑 integration tests 用的 PostgreSQL + pgvector。
# 對齊 drizzle.test.config.ts（localhost:5433, test/test/cc_memory_test）。
#
# 啟動： docker compose -f docker-compose.test.yml up -d
# 停止： docker compose -f docker-compose.test.yml down
# 清資料：docker compose -f docker-compose.test.yml down -v

services:
  cc-memory-test-pg:
    image: pgvector/pgvector:pg16
    container_name: cc-memory-test-pg
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cc_memory_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d cc_memory_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - cc-memory-test-pg-data:/var/lib/postgresql/data

volumes:
  cc-memory-test-pg-data:
