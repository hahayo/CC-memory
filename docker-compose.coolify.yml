# docker-compose.coolify.yml
# Coolify 部署：PostgreSQL + pgvector（personal DB / project DB 共用此 compose）
#
# 為何不寫 Dockerfile：
#   pgvector/pgvector 已是 official image（postgres + pgvector 預裝），自寫
#   Dockerfile 純粹多出 base / build / 版本偏移維護面。Coolify 把 compose
#   當 single source of truth，env / volume / network 全在這裡定義。
#
# 對齊 Zeabur 現況：
#   personal DB 在 Zeabur 用 pgvector/pgvector:pg18，dump 來源版本 PG 18.3。
#   restore 流程見 README「## Coolify 部署」。
#
# Coolify 步驟：
#   1. Coolify Dashboard → New Resource → Docker Compose Empty
#   2. Git Source 指這個 repo，Compose file path = docker-compose.coolify.yml
#   3. 部署完，到該 service Settings 開啟「Make it public」拿到 public port
#   4. 本機 MCP server 用 public host:port 連線

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      # Coolify magic env：SERVICE_PASSWORD_* 首次部署隨機生成、寫入 Coolify
      # Environment Variables 後 persist，重啟不變。username / dbname 走 default
      # 但保留覆寫空間。
      - POSTGRES_USER=${POSTGRES_USER:-cc_memory}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-cc_memory_personal}
    volumes:
      # PG 18+ 必須 mount 在 /var/lib/postgresql（不是 /data）—— 18+ image 改用
      # major-version-specific subdirectory（為了相容 pg_upgrade --link），
      # 舊的 /data mount 會被視為 "unused mount/volume" 並 hard-error 退出。
      # ref: https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ 是 docker-compose escape；container 內變 $POSTGRES_USER
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # PG 只 bind host loopback（不對 internet 暴露 5432）。本機連線經 SSH tunnel：
    #   ssh -L 5432:127.0.0.1:5432 root@coolify.hahauccu.com
    # 然後本機 DATABASE_URL_PERSONAL 連 127.0.0.1:5432 即可。
    # 不走「Make it public」，因 PG protocol 無 TLS、明文走公網有風險。
    ports:
      - "127.0.0.1:5432:5432"

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      CC_BACKUP_TARGET: ${CC_BACKUP_TARGET}
      CC_BACKUP_TMP_DIR: /backup-tmp
      CC_MEMORY_AGE_RECIPIENT: ${CC_MEMORY_AGE_RECIPIENT}
      CC_MEMORY_R2_BUCKET: ${CC_MEMORY_R2_BUCKET}
      CC_MEMORY_REQUIRE_ALERTS: "1"
      CC_MEMORY_ALERT_BOT_TOKEN: ${CC_MEMORY_ALERT_BOT_TOKEN}
      CC_MEMORY_ALERT_CHAT_ID: ${CC_MEMORY_ALERT_CHAT_ID}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-cc_memory_personal}
      PGUSER: ${POSTGRES_USER:-cc_memory}
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      TZ: Asia/Taipei
    tmpfs:
      - /backup-tmp:size=2g,mode=0700,uid=999,gid=999
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -x /app/cc-memory-backup.sh && findmnt -rn -o FSTYPE --target /backup-tmp | grep -qx tmpfs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  postgres-data:
